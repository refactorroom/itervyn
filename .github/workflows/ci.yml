name: Verify
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve latest stable provider releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for provider in invaris evaris; do
            tag=$(gh release view --repo "refactorroom/$provider" --json tagName --jq '.tagName')
            if [[ ! "$tag" =~ $pattern ]]; then
              echo "::error::Expected a stable release tag for $provider"
              exit 1
            fi
            printf '%s=%s\n' "$provider" "$tag" >> "$GITHUB_OUTPUT"
            echo "Testing $provider $tag"
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: refactorroom/invaris
          ref: refs/tags/${{ steps.releases.outputs.invaris }}
          path: .panda-suite/upstream/invaris
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: refactorroom/evaris
          ref: refs/tags/${{ steps.releases.outputs.evaris }}
          path: .panda-suite/upstream/evaris
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l cmd internal examples .itervyn-policy/guard)"
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
          go vet ./.itervyn-policy/guard
      - name: Build native tools from release tags
        env:
          INVARIS_TAG: ${{ steps.releases.outputs.invaris }}
          EVARIS_TAG: ${{ steps.releases.outputs.evaris }}
        run: |
          mkdir -p .panda-suite/build
          (cd .panda-suite/upstream/invaris && go build -trimpath \
            -ldflags "-X github.com/akkaraponph/invaris/internal/engine.releaseVersion=$INVARIS_TAG" \
            -o "$GITHUB_WORKSPACE/.panda-suite/build/invaris" ./cmd/invaris)
          (cd .panda-suite/upstream/evaris && go build -trimpath \
            -ldflags "-X main.version=$EVARIS_TAG" \
            -o "$GITHUB_WORKSPACE/.panda-suite/build/evaris" ./cmd/evaris)
          test "$(.panda-suite/build/invaris --version)" = "invaris $INVARIS_TAG"
          test "$(.panda-suite/build/evaris --version)" = "evaris $EVARIS_TAG"
      - name: Unit and real-provider acceptance with race detection
        run: |
          export ITERVYN_TEST_INVARIS="$GITHUB_WORKSPACE/.panda-suite/build/invaris"
          export ITERVYN_TEST_EVARIS="$GITHUB_WORKSPACE/.panda-suite/build/evaris"
          export ITERVYN_EVIDENCE_DIR="$GITHUB_WORKSPACE/.panda-suite/evidence"
          go test -race ./... -count=1
      - name: Published schemas against actual records
        run: |
          python3 -m venv .panda-suite/schema-venv
          .panda-suite/schema-venv/bin/pip install -r scripts/requirements-schema.txt
          .panda-suite/schema-venv/bin/python scripts/validate-schemas.py --evidence .panda-suite/evidence
