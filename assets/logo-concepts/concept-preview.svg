<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title"><title id="title">Itervyn — three logo concepts</title><rect width="1600" height="1000" fill="#EEF2EF"/><text x="72" y="74" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#59655F">ITERVYN / IDENTITY EXPLORATION</text><text x="68" y="152" font-family="Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#121D2B">One panda. Three directions.</text><text x="72" y="199" font-family="Arial,sans-serif" font-size="23" fill="#59655F">Built from your terminal panda. Designed for a verification CLI.</text><rect x="72" y="252" width="472" height="582" rx="24" fill="#FFFFFF"/><text x="100" y="296" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#65736B">01 / RECOMMENDED</text><g transform="translate(180 325)"><g id="terminal-panda"><circle cx="70" cy="66" r="32" fill="#121D2B"/><circle cx="186" cy="66" r="32" fill="#121D2B"/><path d="M128 49C77 49 40 85 40 136C40 184 75 214 128 214S216 184 216 136C216 85 179 49 128 49Z" fill="#F4F7F6" stroke="#121D2B" stroke-width="14"/><path d="M37 111Q128 91 219 111L216 158Q128 179 40 158Z" fill="#121D2B"/><path d="m91 122 15 14-15 14m32 0h29" fill="none" stroke="#27DCC1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M113 184Q128 179 143 184Q140 196 128 197Q116 196 113 184Z" fill="#121D2B"/></g></g><text x="308" y="640" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#121D2B">Itervyn</text><path d="M100 679h416" stroke="#E7ECE8"/><text x="100" y="722" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#121D2B">Terminal Panda</text><text x="100" y="761" font-family="Arial,sans-serif" font-size="18" fill="#59655F">The terminal visor becomes the signature.</text><text x="100" y="788" font-family="Arial,sans-serif" font-size="18" fill="#59655F">Direct, compact, and closest to your icon.</text><rect x="564" y="252" width="472" height="582" rx="24" fill="#FFFFFF"/><text x="592" y="296" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#65736B">02 / EXPLORATION</text><g transform="translate(672 325)"><g id="iteration-loop"><path d="M40 67A103 103 0 0 1 218 70" fill="none" stroke="#27DCC1" stroke-width="15" stroke-linecap="round"/><path d="m194 66 29 15 5-32" fill="none" stroke="#27DCC1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M216 189A103 103 0 0 1 38 186" fill="none" stroke="#27DCC1" stroke-width="15" stroke-linecap="round"/><path d="m62 190-29-15-5 32" fill="none" stroke="#27DCC1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="91" r="24" fill="#121D2B"/><circle cx="174" cy="91" r="24" fill="#121D2B"/><rect x="62" y="87" width="132" height="100" rx="47" fill="#F4F7F6" stroke="#121D2B" stroke-width="10"/><ellipse cx="99" cy="131" rx="17" ry="22" transform="rotate(24 99 131)" fill="#121D2B"/><ellipse cx="157" cy="131" rx="17" ry="22" transform="rotate(-24 157 131)" fill="#121D2B"/><path d="m120 158h16l-8 10Z" fill="#121D2B"/></g></g><text x="800" y="640" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#121D2B">Itervyn</text><path d="M592 679h416" stroke="#E7ECE8"/><text x="592" y="722" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#121D2B">Iteration Loop</text><text x="592" y="761" font-family="Arial,sans-serif" font-size="18" fill="#59655F">A panda held inside a repeat cycle.</text><text x="592" y="788" font-family="Arial,sans-serif" font-size="18" fill="#59655F">Expresses execute, verify, refine, repeat.</text><rect x="1056" y="252" width="472" height="582" rx="24" fill="#FFFFFF"/><text x="1084" y="296" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#65736B">03 / EXPLORATION</text><g transform="translate(1164 325)"><g id="bracket-panda"><path d="M63 58H30V198H63M193 58H226V198H193" fill="none" stroke="#27DCC1" stroke-width="15" stroke-linejoin="round"/><circle cx="87" cy="83" r="23" fill="#121D2B"/><circle cx="169" cy="83" r="23" fill="#121D2B"/><path d="M128 77C91 77 66 104 66 141C66 178 90 198 128 198S190 178 190 141C190 104 165 77 128 77Z" fill="#F4F7F6" stroke="#121D2B" stroke-width="11"/><path d="m91 121 14 14-14 14m74-28-14 14 14 14" stroke="#121D2B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M120 169h16l-8 10Z" fill="#121D2B"/></g></g><text x="1292" y="640" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#121D2B">Itervyn</text><path d="M1084 679h416" stroke="#E7ECE8"/><text x="1084" y="722" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#121D2B">Bracket Panda</text><text x="1084" y="761" font-family="Arial,sans-serif" font-size="18" fill="#59655F">Code brackets frame a focused panda.</text><text x="1084" y="788" font-family="Arial,sans-serif" font-size="18" fill="#59655F">A clear developer-tool identity.</text><circle cx="84" cy="897" r="12" fill="#121D2B"/><circle cx="120" cy="897" r="12" fill="#27DCC1"/><circle cx="156" cy="897" r="12" fill="#FFFFFF" stroke="#CCD5CF"/><text x="192" y="904" font-family="Arial,sans-serif" font-size="18" fill="#59655F">Ink + mint + porcelain</text><text x="72" y="952" font-family="Arial,sans-serif" font-size="17" fill="#59655F">Original artwork preserved • Editable vector concepts • Exact wordmark: Itervyn</text></svg>
